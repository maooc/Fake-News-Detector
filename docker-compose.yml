version: '3.8'

services:
  fake-news-detector:
    build:
      context: .
      dockerfile: Dockerfile
    image: fake-news-detector:latest
    container_name: fake-news-detector
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
